name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python 3.10 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'

      - name: Run synthetic tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v

      - name: Check Python syntax
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m py_compile apple-voice-memos/scripts/voice_memos.py apple-voice-memos/scripts/voice-memos

      - name: Check CLI help
        run: python3 apple-voice-memos/scripts/voice-memos --help
